<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SentinelAI Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<script>
// Server transport: HTTP for actions, server-sent events for the live timeline.
const post = (url, body) => fetch(url, {method: 'POST', headers: {'content-type': 'application/json'}, body: body && JSON.stringify(body)})
  .then(async r => { if (!r.ok) throw new Error(await r.text()); return r; });
window.sentinelTransport = {
  label: 'live demo',
  pollCases: true,
  cases: () => fetch('/api/cases').then(r => r.text()),
  run: body => post('/api/run', body),
  approve: (id, verdict) => post(`/api/approvals/${id}/${verdict}`),
  state: () => fetch('/api/state').then(r => r.json()),
  reset: () => post('/api/reset'),
  policy: () => fetch('/api/policy').then(r => r.text()),
  subscribe(onEvent, onStatus) {
    const es = new EventSource('/api/events');
    es.onopen = () => onStatus(true);
    es.onerror = () => onStatus(false);
    for (const t of ['run', 'step', 'done', 'approval', 'approval_resolved', 'state'])
      es.addEventListener(t, e => onEvent(t, JSON.parse(e.data)));
  },
};
</script>
<script src="app.js"></script>
</body>
</html>
